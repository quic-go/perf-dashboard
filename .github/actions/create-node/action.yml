name: Create benchmark node
description: Create one temporary benchmark node with Terraform.

inputs:
  role:
    required: true
    description: Node role, for example server or client.
  cloud_provider:
    required: true
    description: Cloud provider Terraform root to use.
  location:
    required: true
    description: Provider location, for example AWS region, GCP zone, or Azure region.
  machine_type:
    description: VM type; leave blank to use the Terraform default for the cloud provider.
  name:
    required: true
    description: Unique Terraform node name.

runs:
  using: composite
  steps:
    - name: Create node
      shell: bash
      env:
        TF_VAR_name: ${{ inputs.name }}
        TF_VAR_location: ${{ inputs.location }}
        MACHINE_TYPE: ${{ inputs.machine_type }}
        ROLE: ${{ inputs.role }}
        CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      run: |
        set -euo pipefail

        if [[ -n "${MACHINE_TYPE}" ]]; then
          export TF_VAR_machine_type="${MACHINE_TYPE}"
          case "${CLOUD_PROVIDER}" in
            aws)
              architecture="$(aws ec2 describe-instance-types --region "${TF_VAR_location}" --instance-types "${MACHINE_TYPE}" \
                --query "InstanceTypes[0].ProcessorInfo.SupportedArchitectures[?@=='arm64' || @=='x86_64'] | [0]" --output text)"
              ;;
            gcp)
              architecture="$(gcloud compute machine-types describe "${MACHINE_TYPE}" --project "${TF_VAR_gcp_project_id}" \
                --zone "${TF_VAR_location}" --format='value(architecture)')"
              # Older x86 machine types omit the architecture field.
              architecture="${architecture:-X86_64}"
              ;;
            azure)
              architecture="$(az vm list-skus --location "${TF_VAR_location}" --resource-type virtualMachines --size "${MACHINE_TYPE}" --all \
                --query "[?name=='${MACHINE_TYPE}'].capabilities[] | [?name=='CpuArchitectureType'].value | [0]" --output tsv)"
              ;;
          esac
          case "${architecture}" in
            arm64|ARM64|Arm64) export TF_VAR_architecture=arm64 ;;
            x86_64|X86_64|x64) export TF_VAR_architecture=amd64 ;;
            *) echo "Unsupported CPU architecture: ${architecture}" >&2; exit 1 ;;
          esac
        fi

        node_dir="${RUNNER_TEMP}/${ROLE}-node"
        mkdir -p "${node_dir}"
        cp -R "${GITHUB_WORKSPACE}/infra/${CLOUD_PROVIDER}/." "${node_dir}/"
        terraform -chdir="${node_dir}" init -input=false
        terraform -chdir="${node_dir}" apply -input=false -auto-approve

        terraform -chdir="${node_dir}" output -json node > "${node_dir}/node.json"
