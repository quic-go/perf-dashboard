name: Create benchmark node
description: Create one temporary benchmark node with Terraform.

inputs:
  role:
    required: true
    description: Node role, for example server or client.
  cloud_provider:
    required: true
    description: Cloud provider Terraform root to use.
  location:
    required: true
    description: Provider location, for example AWS region, GCP zone, or Azure region.
  name:
    required: true
    description: Unique Terraform node name.

runs:
  using: composite
  steps:
    - name: Create node
      shell: bash
      env:
        TF_VAR_name: ${{ inputs.name }}
        TF_VAR_location: ${{ inputs.location }}
        ROLE: ${{ inputs.role }}
        CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      run: |
        set -euo pipefail

        node_dir="${RUNNER_TEMP}/${ROLE}-node"
        mkdir -p "${node_dir}"
        cp -R "${GITHUB_WORKSPACE}/infra/${CLOUD_PROVIDER}/." "${node_dir}/"
        terraform -chdir="${node_dir}" init -input=false
        terraform -chdir="${node_dir}" apply -input=false -auto-approve

        terraform -chdir="${node_dir}" output -json node > "${node_dir}/node.json"
