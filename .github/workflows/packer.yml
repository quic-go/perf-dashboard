name: Build images

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PKR_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  PKR_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
  PKR_VAR_ssh_public_key_primary: ${{ vars.SSH_PUBLIC_KEY_PRIMARY }}
  PKR_VAR_ssh_public_keys_additional: ${{ vars.SSH_PUBLIC_KEYS_ADDITIONAL || '[]' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: "1.15.2"
      - name: packer fmt -check
        run: packer fmt -check -diff .
      - name: packer init
        run: packer init .
      - name: packer validate (AWS)
        run: packer validate -only=amazon-ebs.ubuntu .
      - name: packer validate (GCP)
        if: vars.GCP_PROJECT_ID != ''
        run: packer validate -only=googlecompute.ubuntu .
      - name: packer validate (Azure)
        if: vars.AZURE_RESOURCE_GROUP != ''
        run: packer validate -only=azure-arm.ubuntu .

  gcp:
    name: Build GCP image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'cloud-test' || null }}
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    concurrency:
      group: cloud-gcp
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=googlecompute.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find GCP image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ steps.manifest.outputs.image_id }}"
          IMAGE_NAME="${IMAGE_NAME##*/}"
          IMAGE_SIZE=$(gcloud compute images describe "${IMAGE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(archiveSizeBytes)')
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  aws:
    name: Build AWS image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'cloud-test' || null }}
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    concurrency:
      group: cloud-aws
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
      - uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=amazon-ebs.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find AWS image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_ID="${{ steps.manifest.outputs.image_id }}"
          IMAGE_ID="${IMAGE_ID##*:}"
          # shellcheck disable=SC2016
          SNAPSHOT_ID=$(aws ec2 describe-images \
            --image-ids "${IMAGE_ID}" \
            --query 'Images[0].BlockDeviceMappings[?DeviceName==`/dev/sda1`].Ebs.SnapshotId' \
            --output text \
            --region us-west-2)
          IMAGE_SIZE=$(aws ec2 describe-snapshots \
            --snapshot-ids "${SNAPSHOT_ID}" \
            --query 'Snapshots[0].[FullSnapshotSizeInBytes]' \
            --output text \
            --region us-west-2)
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  azure:
    name: Build Azure image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'cloud-test' || null }}
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
    concurrency:
      group: cloud-azure
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=azure-arm.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          IMAGE_NAME="$(jq -r '.builds[-1].custom_data.image_name // empty' packer-manifest.json)"
          if [ -z "${IMAGE_NAME}" ]; then
            echo "Could not find image_name in Packer manifest" >&2
            jq . packer-manifest.json >&2 || true
            exit 1
          fi
          echo "image_id=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
      - name: Mark Azure image as retained
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az tag update \
            --resource-id "/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Compute/images/${{ steps.manifest.outputs.image_id }}" \
            --operation Merge \
            --tags PackerLifecycle=retained \
            --output none

  summary:
    name: Build summary
    needs: [gcp, aws, azure]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Azure managed images expose provisioned disk size, not a comparable
      # actual image byte count, so the summary intentionally uses a placeholder.
      - name: Write build summary
        run: |
          set -euo pipefail

          format_gb() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then
              awk -v bytes="$1" 'BEGIN { printf "%.3f", bytes / 1000000000 }'
            else
              printf "N/A"
            fi
          }

          aws_image_size_gb="$(format_gb "${{ needs.aws.outputs.image_size || '' }}")"
          gcp_image_size_gb="$(format_gb "${{ needs.gcp.outputs.image_size || '' }}")"

          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Image Build Results

          | Provider | Result | Image ID | Image Size (GB) |
          EOF
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          | --- | --- | --- | --- |
          | AWS | ${{ needs.aws.result }} | ${{ needs.aws.outputs.image_id || 'N/A' }} | ${aws_image_size_gb} |
          | GCP | ${{ needs.gcp.result }} | ${{ needs.gcp.outputs.image_id || 'N/A' }} | ${gcp_image_size_gb} |
          | Azure | ${{ needs.azure.result }} | ${{ needs.azure.outputs.image_id || 'N/A' }} | --- |
          EOF
