name: Build images

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      debug:
        description: Run AWS, GCP, and Azure image builds through the cloud-test environment
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PKR_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  PKR_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer fmt -check
        run: packer fmt -check -diff .
      - name: packer init
        run: packer init .
      - name: packer validate (AWS)
        run: packer validate -only=amazon-ebs.ubuntu .
      - name: packer validate (GCP)
        run: packer validate -only=googlecompute.ubuntu .
      - name: packer validate (Azure)
        run: packer validate -only=azure-arm.ubuntu .

  gcp:
    name: Build GCP image
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.debug)
    runs-on: ubuntu-latest
    environment: ${{ inputs.debug && 'cloud-test' || null }}
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    concurrency:
      group: packer-gcp-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=googlecompute.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find GCP image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ steps.manifest.outputs.image_id }}"
          IMAGE_NAME="${IMAGE_NAME##*/}"
          IMAGE_SIZE=$(gcloud compute images describe "${IMAGE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(archiveSizeBytes)')
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  aws:
    name: Build AWS image
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.debug)
    runs-on: ubuntu-latest
    environment: ${{ inputs.debug && 'cloud-test' || null }}
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    concurrency:
      group: packer-aws-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=amazon-ebs.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find AWS image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_ID="${{ steps.manifest.outputs.image_id }}"
          IMAGE_ID="${IMAGE_ID##*:}"
          # shellcheck disable=SC2016
          SNAPSHOT_ID=$(aws ec2 describe-images \
            --image-ids "${IMAGE_ID}" \
            --query 'Images[0].BlockDeviceMappings[?DeviceName==`/dev/sda1`].Ebs.SnapshotId' \
            --output text \
            --region us-west-2)
          IMAGE_SIZE=$(aws ec2 describe-snapshots \
            --snapshot-ids "${SNAPSHOT_ID}" \
            --query 'Snapshots[0].[FullSnapshotSizeInBytes]' \
            --output text \
            --region us-west-2)
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  azure:
    name: Build Azure image
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.debug)
    runs-on: ubuntu-latest
    environment: ${{ inputs.debug && 'cloud-test' || null }}
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    concurrency:
      group: packer-azure-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=azure-arm.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find Azure image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          BYTES_PER_GIBIBYTE=1073741824
          IMAGE_ID="${{ steps.manifest.outputs.image_id }}"
          OS_DISK_ID="$(az image show \
            --ids "${IMAGE_ID}" \
            --query 'storageProfile.osDisk.managedDisk.id' \
            --output tsv)"
          if [ -n "${OS_DISK_ID}" ] && [ "${OS_DISK_ID}" != "null" ]; then
            IMAGE_SIZE="$(az disk show \
              --ids "${OS_DISK_ID}" \
              --query 'diskSizeBytes' \
              --output tsv)"
          else
            DISK_SIZE_GB="$(az image show \
              --ids "${IMAGE_ID}" \
              --query 'storageProfile.osDisk.diskSizeGB' \
              --output tsv)"
            IMAGE_SIZE=$((DISK_SIZE_GB * BYTES_PER_GIBIBYTE))
          fi
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  summary:
    name: Build summary
    needs: [gcp, aws, azure]
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.debug))
    runs-on: ubuntu-latest
    steps:
      - name: Write build summary
        run: |
          set -euo pipefail

          format_gb() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then
              awk -v bytes="$1" 'BEGIN { printf "%.3f", bytes / 1000000000 }'
            else
              printf "N/A"
            fi
          }

          aws_image_size_gb="$(format_gb "${{ needs.aws.outputs.image_size || '' }}")"
          gcp_image_size_gb="$(format_gb "${{ needs.gcp.outputs.image_size || '' }}")"
          azure_image_size_gb="$(format_gb "${{ needs.azure.outputs.image_size || '' }}")"

          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Image Build Results

          | Provider | Result | Image ID | Image Size (GB) |
          EOF
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          | --- | --- | --- | --- |
          | AWS | ${{ needs.aws.result }} | ${{ needs.aws.outputs.image_id || 'N/A' }} | ${aws_image_size_gb} |
          | GCP | ${{ needs.gcp.result }} | ${{ needs.gcp.outputs.image_id || 'N/A' }} | ${gcp_image_size_gb} |
          | Azure | ${{ needs.azure.result }} | ${{ needs.azure.outputs.image_id || 'N/A' }} | ${azure_image_size_gb} |
          EOF
