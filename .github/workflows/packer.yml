name: Build images

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer fmt -check
        run: packer fmt -check -diff .
      - name: packer init
        run: packer init .
      - name: packer validate (AWS)
        run: packer validate -only=amazon-ebs.ubuntu .
      - name: packer validate (GCP)
        if: ${{ vars.GCP_PROJECT_ID != '' }}
        run: packer validate -only=googlecompute.ubuntu -var "gcp_project_id=${{ vars.GCP_PROJECT_ID }}" .

  gcp:
    name: Build GCP image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    concurrency:
      group: packer-gcp-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=googlecompute.ubuntu -var "gcp_project_id=${{ vars.GCP_PROJECT_ID }}" .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find GCP image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ steps.manifest.outputs.image_id }}"
          IMAGE_NAME="${IMAGE_NAME##*/}"
          IMAGE_SIZE=$(gcloud compute images describe "${IMAGE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(archiveSizeBytes)')
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  aws:
    name: Build AWS image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
      image_size: ${{ steps.image_size.outputs.image_size }}
    concurrency:
      group: packer-aws-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=amazon-ebs.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find AWS image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_ID="${{ steps.manifest.outputs.image_id }}"
          IMAGE_ID="${IMAGE_ID##*:}"
          SNAPSHOT_ID=$(aws ec2 describe-images \
            --image-ids "${IMAGE_ID}" \
            --query 'Images[0].BlockDeviceMappings[?DeviceName==`/dev/sda1`].Ebs.SnapshotId' \
            --output text \
            --region us-west-2)
          IMAGE_SIZE=$(aws ec2 describe-snapshots \
            --snapshot-ids "${SNAPSHOT_ID}" \
            --query 'Snapshots[0].[FullSnapshotSizeInBytes]' \
            --output text \
            --region us-west-2)
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  summary:
    name: Build summary
    needs: [gcp, aws]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Write build summary
        run: |
          set -euo pipefail

          format_gb() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then
              awk -v bytes="$1" 'BEGIN { printf "%.3f", bytes / 1000000000 }'
            else
              printf "N/A"
            fi
          }

          aws_image_size_gb="$(format_gb "${{ needs.aws.outputs.image_size || '' }}")"
          gcp_image_size_gb="$(format_gb "${{ needs.gcp.outputs.image_size || '' }}")"

          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Image Build Results

          | Provider | Result | Image ID | Image Size (GB) |
          EOF
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          | --- | --- | --- | --- |
          | AWS | ${{ needs.aws.result }} | ${{ needs.aws.outputs.image_id || 'N/A' }} | ${aws_image_size_gb} |
          | GCP | ${{ needs.gcp.result }} | ${{ needs.gcp.outputs.image_id || 'N/A' }} | ${gcp_image_size_gb} |
          EOF
