name: Build images

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer fmt -check
        run: packer fmt -check -diff .
      - name: packer init
        run: packer init .
      - name: packer validate
        run: packer validate .

  gcp:
    name: Build GCP image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
    concurrency:
      group: packer-gcp-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=googlecompute.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find GCP image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"

  aws:
    name: Build AWS image
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.manifest.outputs.image_id }}
    concurrency:
      group: packer-aws-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - uses: hashicorp/setup-packer@c3d53c525d422944e50ee27b840746d6522b08de # v3.2.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=amazon-ebs.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find AWS image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"

  summary:
    name: Build summary
    needs: [gcp, aws]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Write build summary
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Image Build Results

          | Provider | Result | Image ID |
          | --- | --- | --- |
          | AWS | ${{ needs.aws.result }} | ${{ needs.aws.outputs.image_id || 'N/A' }} |
          | GCP | ${{ needs.gcp.result }} | ${{ needs.gcp.outputs.image_id || 'N/A' }} |
          EOF
