name: Build images

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "orchestrator/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "orchestrator/**"
  workflow_dispatch:

concurrency:
  group: cloud-artifacts
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  PKR_VAR_build_commit: ${{ github.sha }}
  PKR_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  PKR_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
  PKR_VAR_ssh_public_key_primary: ${{ vars.SSH_PUBLIC_KEY_PRIMARY }}
  PKR_VAR_ssh_public_keys_additional: ${{ vars.SSH_PUBLIC_KEYS_ADDITIONAL || '[]' }}

jobs:
  validate:
    name: Validate
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    env:
      PKR_VAR_architecture: ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.15.2"
      - name: packer fmt -check
        run: packer fmt -check -diff .
      - name: packer init
        run: packer init .
      - name: packer validate (Docker)
        run: packer validate -only=docker.ubuntu .
      - name: packer validate (AWS)
        run: packer validate -only=amazon-ebs.ubuntu .
      - name: packer validate (GCP)
        if: vars.GCP_PROJECT_ID != ''
        run: packer validate -only=googlecompute.ubuntu .
      - name: packer validate (Azure)
        if: vars.AZURE_RESOURCE_GROUP != ''
        run: packer validate -only=azure-arm.ubuntu .

  gcp:
    name: Build GCP image
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    env:
      PKR_VAR_architecture: ${{ matrix.architecture }}
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref != 'refs/heads/master' && 'cloud-test' || null }}
    outputs:
      image_id: ${{ matrix.architecture == 'amd64' && steps.manifest.outputs.image_id || '' }}
      image_id_arm64: ${{ matrix.architecture == 'arm64' && steps.manifest.outputs.image_id || '' }}
      image_size: ${{ matrix.architecture == 'amd64' && steps.image_size.outputs.image_size || '' }}
      image_size_arm64: ${{ matrix.architecture == 'arm64' && steps.image_size.outputs.image_size || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=googlecompute.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find GCP image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ steps.manifest.outputs.image_id }}"
          IMAGE_NAME="${IMAGE_NAME##*/}"
          IMAGE_SIZE=$(gcloud compute images describe "${IMAGE_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(archiveSizeBytes)')
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  aws:
    name: Build AWS image
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    env:
      PKR_VAR_architecture: ${{ matrix.architecture }}
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref != 'refs/heads/master' && 'cloud-test' || null }}
    outputs:
      image_id: ${{ matrix.architecture == 'amd64' && steps.manifest.outputs.image_id || '' }}
      image_id_arm64: ${{ matrix.architecture == 'arm64' && steps.manifest.outputs.image_id || '' }}
      image_size: ${{ matrix.architecture == 'amd64' && steps.image_size.outputs.image_size || '' }}
      image_size_arm64: ${{ matrix.architecture == 'arm64' && steps.image_size.outputs.image_size || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=amazon-ebs.ubuntu .
      - name: Read Packer manifest
        id: manifest
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.builds[-1].artifact_id // empty' packer-manifest.json)"
          if [ -z "${artifact_id}" ]; then
            echo "Could not find AWS image ID in Packer manifest" >&2
            exit 1
          fi
          echo "image_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
      - name: Determine image size
        id: image_size
        run: |
          set -euo pipefail
          IMAGE_ID="${{ steps.manifest.outputs.image_id }}"
          IMAGE_ID="${IMAGE_ID##*:}"
          # shellcheck disable=SC2016
          SNAPSHOT_ID=$(aws ec2 describe-images \
            --image-ids "${IMAGE_ID}" \
            --query 'Images[0].BlockDeviceMappings[?DeviceName==`/dev/sda1`].Ebs.SnapshotId' \
            --output text \
            --region us-west-2)
          IMAGE_SIZE=$(aws ec2 describe-snapshots \
            --snapshot-ids "${SNAPSHOT_ID}" \
            --query 'Snapshots[0].[FullSnapshotSizeInBytes]' \
            --output text \
            --region us-west-2)
          echo "image_size=${IMAGE_SIZE}" >> "${GITHUB_OUTPUT}"

  azure:
    name: Build Azure image
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    env:
      PKR_VAR_architecture: ${{ matrix.architecture }}
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref != 'refs/heads/master' && 'cloud-test' || null }}
    outputs:
      image_id: ${{ matrix.architecture == 'amd64' && steps.manifest.outputs.image_id || '' }}
      image_id_arm64: ${{ matrix.architecture == 'arm64' && steps.manifest.outputs.image_id || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare Azure Compute Gallery
        run: |
          az sig show --resource-group "${PKR_VAR_azure_resource_group}" --gallery-name quicperfrunner --output none ||
          az sig create \
            --resource-group "${PKR_VAR_azure_resource_group}" \
            --gallery-name quicperfrunner \
            --tags ManagedBy=packer PackerLifecycle=retained \
            --output none
          az sig image-definition create \
            --resource-group "${PKR_VAR_azure_resource_group}" \
            --gallery-name quicperfrunner \
            --gallery-image-definition "quic-perf-runner-${PKR_VAR_architecture}" \
            --publisher quic-go --offer perf-dashboard --sku "runner-${PKR_VAR_architecture}" \
            --os-type Linux --os-state Generalized --architecture "${{ matrix.architecture == 'amd64' && 'x64' || 'Arm64' }}" \
            --hyper-v-generation V2 --features SecurityType=Standard \
            --tags ManagedBy=packer PackerLifecycle=retained \
            --output none
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "1.15.2"
      - name: packer init
        run: packer init .
      - name: packer build
        run: packer build -color=false -only=azure-arm.ubuntu .
      - name: Retain Azure image version and include it in latest
        id: manifest
        run: |
          set -euo pipefail
          image_id="$(jq -er '.builds[-1].artifact_id | select(type == "string" and length > 0)' packer-manifest.json)"
          az sig image-version update \
            --resource-group "${PKR_VAR_azure_resource_group}" \
            --gallery-name quicperfrunner \
            --gallery-image-definition "quic-perf-runner-${PKR_VAR_architecture}" \
            --gallery-image-version "${image_id##*/}" \
            --set tags.PackerLifecycle=retained publishingProfile.excludeFromLatest=false \
            --output none
          echo "image_id=${image_id}" >> "${GITHUB_OUTPUT}"

  summary:
    name: Build summary
    needs: [gcp, aws, azure]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # Azure images expose provisioned disk size, not a comparable
      # actual image byte count, so the summary intentionally uses a placeholder.
      - name: Write build summary
        run: |
          set -euo pipefail

          format_gb() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then
              awk -v bytes="$1" 'BEGIN { printf "%.3f", bytes / 1000000000 }'
            else
              printf "N/A"
            fi
          }

          aws_image_size_gb="$(format_gb "${{ needs.aws.outputs.image_size || '' }}")"
          aws_arm64_image_size_gb="$(format_gb "${{ needs.aws.outputs.image_size_arm64 || '' }}")"
          gcp_image_size_gb="$(format_gb "${{ needs.gcp.outputs.image_size || '' }}")"
          gcp_arm64_image_size_gb="$(format_gb "${{ needs.gcp.outputs.image_size_arm64 || '' }}")"

          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Image Build Results

          | Provider | Result | Image ID | Image Size (GB) |
          EOF
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          | --- | --- | --- | --- |
          | AWS | ${{ needs.aws.result }} | amd64: ${{ needs.aws.outputs.image_id || 'N/A' }}<br>arm64: ${{ needs.aws.outputs.image_id_arm64 || 'N/A' }} | amd64: ${aws_image_size_gb}<br>arm64: ${aws_arm64_image_size_gb} |
          | GCP | ${{ needs.gcp.result }} | amd64: ${{ needs.gcp.outputs.image_id || 'N/A' }}<br>arm64: ${{ needs.gcp.outputs.image_id_arm64 || 'N/A' }} | amd64: ${gcp_image_size_gb}<br>arm64: ${gcp_arm64_image_size_gb} |
          | Azure | ${{ needs.azure.result }} | amd64: ${{ needs.azure.outputs.image_id || 'N/A' }}<br>arm64: ${{ needs.azure.outputs.image_id_arm64 || 'N/A' }} | --- |
          EOF
