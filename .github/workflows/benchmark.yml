name: Run benchmark

on:
  workflow_call:
    inputs:
      scenario:
        required: true
        type: string
      server_location:
        required: true
        type: string
      client_location:
        required: true
        type: string
      server_machine_type:
        type: string
      client_machine_type:
        type: string
      download_bytes:
        type: number
        default: 1000000000
      duration_seconds:
        type: number
        default: 12
      concurrency:
        type: number

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY_PRIMARY }}

jobs:
  create-node:
    name: Create ${{ matrix.role }} node
    runs-on: ubuntu-latest
    environment: ${{ github.ref != 'refs/heads/master' && 'cloud-test' || null }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: server
            target: ${{ inputs.server_location }}
            machine_type: ${{ inputs.server_machine_type }}
          - role: client
            target: ${{ inputs.client_location }}
            machine_type: ${{ inputs.client_machine_type }}
    steps:
      - &resolve_location
        name: Resolve cloud location
        id: target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          read -r provider separator location <<< "${TARGET}"
          [[ "${separator}" == / && "${provider}" =~ ^(aws|gcp|azure)$ && "${location}" =~ ^[a-z0-9-]+$ ]]
          echo "provider=${provider}" >> "${GITHUB_OUTPUT}"
          echo "location=${location}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        if: steps.target.outputs.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Authenticate to GCP
        if: steps.target.outputs.provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}

      - name: Authenticate to Azure
        if: steps.target.outputs.provider == 'azure'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Create node
        uses: ./.github/actions/create-node
        with:
          role: ${{ matrix.role }}
          cloud_provider: ${{ steps.target.outputs.provider }}
          location: ${{ steps.target.outputs.location }}
          machine_type: ${{ matrix.machine_type }}
          name: quic-perf-${{ steps.target.outputs.provider }}-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.role }}-node
          path: |
            ${{ runner.temp }}/${{ matrix.role }}-node/terraform.tfstate
            ${{ runner.temp }}/${{ matrix.role }}-node/node.json
          retention-days: 1
          if-no-files-found: ignore

  benchmark:
    name: ${{ matrix.client_implementation }} client ← ${{ matrix.server_implementation }} server
    needs: create-node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # All benchmarks share the same nodes and UDP port.
      max-parallel: 1
      matrix:
        server_implementation: [quic-go, msquic]
        client_implementation: [quic-go, msquic]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-node"
          path: ${{ runner.temp }}

      - name: Read node info
        id: nodes
        run: |
          server_node="${RUNNER_TEMP}/server-node/node.json"
          client_node="${RUNNER_TEMP}/client-node/node.json"
          jq -r '"server_ip=\(.public_ip)"' "${server_node}" >> "${GITHUB_OUTPUT}"
          jq -r '"client_ip=\(.public_ip)"' "${client_node}" >> "${GITHUB_OUTPUT}"

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_PRIMARY }}
        run: |
          printf '%b\n' "${SSH_PRIVATE_KEY}" | sed 's/\r$//' > "${RUNNER_TEMP}/quic-perf"
          chmod 0600 "${RUNNER_TEMP}/quic-perf"

      - name: Run benchmark
        env:
          SCENARIO: ${{ inputs.scenario }}
          DOWNLOAD_BYTES: ${{ inputs.download_bytes }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          if [[ "${SCENARIO}" == throughput ]]; then
            parameters=(--download-bytes "${DOWNLOAD_BYTES}")
          else
            parameters=(--duration-seconds "${DURATION_SECONDS}" --concurrency "${CONCURRENCY}")
          fi
          python3 orchestrator/run_benchmark.py "${SCENARIO}" "${parameters[@]}" \
            --identity-file "${RUNNER_TEMP}/quic-perf" \
            --server-host "${{ steps.nodes.outputs.server_ip }}" \
            --client-host "${{ steps.nodes.outputs.client_ip }}" \
            --server-implementation "${{ matrix.server_implementation }}" \
            --client-implementation "${{ matrix.client_implementation }}" \
            > "${RUNNER_TEMP}/benchmark-result.json"

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-result-${{ inputs.scenario }}-${{ matrix.client_implementation }}-${{ matrix.server_implementation }}
          path: ${{ runner.temp }}/benchmark-result.json
          if-no-files-found: error

  summary:
    name: Benchmark summary
    needs: [create-node, benchmark]
    if: always() && needs.create-node.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'measurements' || 'cloud-test' }}
    # serialize reports so concurrent runs don't race when pushing measurements
    concurrency:
      group: publish-benchmark-results
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/benchmark-artifacts

      - name: Write benchmark report
        run: |
          python3 .github/scripts/benchmark_report.py \
            "${RUNNER_TEMP}/benchmark-artifacts" \
            --test "${{ inputs.scenario }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            > "${RUNNER_TEMP}/benchmark-report.json"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-${{ inputs.scenario }}
          path: ${{ runner.temp }}/benchmark-report.json
          if-no-files-found: error

      - name: Check out measurements repository
        uses: actions/checkout@v7
        with:
          repository: quic-go/perf-measurements
          ssh-key: ${{ secrets.MEASUREMENTS_DEPLOY_KEY }}
          path: measurements

      - name: Publish benchmark report
        working-directory: measurements
        env:
          SCENARIO: ${{ inputs.scenario }}
          CLIENT_LOCATION: ${{ inputs.client_location }}
          SERVER_LOCATION: ${{ inputs.server_location }}
        run: |
          recorded_at="$(jq -r '.recorded_at' "${RUNNER_TEMP}/benchmark-report.json")"
          report_path="$(date --utc --date="${recorded_at}" +%Y/%m/%F)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"
          mkdir -p "$(dirname "${report_path}")"
          cp "${RUNNER_TEMP}/benchmark-report.json" "${report_path}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${report_path}"
          git commit \
            -m "$(date --utc --date="${recorded_at}" '+%F %TZ') ${SCENARIO}: ${CLIENT_LOCATION} → ${SERVER_LOCATION}" \
            -m "$(jq -r '.run.url' "${RUNNER_TEMP}/benchmark-report.json")"
          git push

      - name: Write benchmark summary
        run: |
          python3 .github/scripts/benchmark_summary.py \
            "${RUNNER_TEMP}/benchmark-report.json" \
            >> "${GITHUB_STEP_SUMMARY}"

  destroy-node:
    name: Destroy ${{ matrix.role }} node
    needs: [create-node, benchmark]
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ github.ref != 'refs/heads/master' && 'cloud-test' || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: server
            target: ${{ inputs.server_location }}
          - role: client
            target: ${{ inputs.client_location }}
    steps:
      - *resolve_location

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ matrix.role }}-node
          path: ${{ runner.temp }}/${{ matrix.role }}-artifact

      - name: Configure AWS credentials
        if: steps.target.outputs.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Authenticate to GCP
        if: steps.target.outputs.provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}

      - name: Authenticate to Azure
        if: steps.target.outputs.provider == 'azure'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Destroy node
        run: |
          state="${{ runner.temp }}/${{ matrix.role }}-artifact/terraform.tfstate"
          [ -f "${state}" ] || exit 0
          terraform -chdir=infra/${{ steps.target.outputs.provider }} init -input=false
          TF_VAR_name="quic-perf-${{ steps.target.outputs.provider }}-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            TF_VAR_location="${{ steps.target.outputs.location }}" \
            terraform -chdir=infra/${{ steps.target.outputs.provider }} destroy -state="${state}" -input=false -auto-approve
