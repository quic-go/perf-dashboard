name: Run benchmark

on:
  workflow_dispatch:
    inputs:
      server_cloud_provider:
        description: Server node cloud provider
        required: true
        type: choice
        options: [aws, gcp, azure]
      server_location:
        description: Server node AWS region, GCP zone, or Azure region
        required: true
      client_cloud_provider:
        description: Client node cloud provider
        required: true
        type: choice
        options: [aws, gcp, azure]
      client_location:
        description: Client node AWS region, GCP zone, or Azure region
        required: true
      server_implementation:
        description: Server implementation
        required: true
        type: choice
        options: [quic-go, msquic]
      client_implementation:
        description: Client implementation
        required: true
        type: choice
        options: [quic-go, msquic]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-benchmark
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY_PRIMARY }}

jobs:
  create-node:
    name: Create ${{ matrix.role }} node
    runs-on: ubuntu-latest
    environment: cloud-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: server
            cloud_provider: ${{ inputs.server_cloud_provider }}
            location: ${{ inputs.server_location }}
            name: quic-perf-${{ inputs.server_cloud_provider }}-server-${{ github.run_id }}-${{ github.run_attempt }}
          - role: client
            cloud_provider: ${{ inputs.client_cloud_provider }}
            location: ${{ inputs.client_location }}
            name: quic-perf-${{ inputs.client_cloud_provider }}-client-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        if: matrix.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Authenticate to GCP
        if: matrix.cloud_provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}

      - name: Authenticate to Azure
        if: matrix.cloud_provider == 'azure'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Create node
        id: node
        uses: ./.github/actions/create-node
        with:
          role: ${{ matrix.role }}
          cloud_provider: ${{ matrix.cloud_provider }}
          location: ${{ matrix.location }}
          name: ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.role }}-node
          path: ${{ runner.temp }}/${{ matrix.role }}-node/terraform.tfstate
          retention-days: 1
          if-no-files-found: ignore

  benchmark:
    name: Benchmark
    needs: create-node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-node"
          path: ${{ runner.temp }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Read node info
        id: nodes
        run: |
          server_state="${RUNNER_TEMP}/server-node/terraform.tfstate"
          client_state="${RUNNER_TEMP}/client-node/terraform.tfstate"
          terraform -chdir=infra/${{ inputs.server_cloud_provider }} output -state="${server_state}" -json node |
            jq -r '"server_ip=\(.public_ip)\nserver_user=\(.user)"' >> "${GITHUB_OUTPUT}"
          terraform -chdir=infra/${{ inputs.client_cloud_provider }} output -state="${client_state}" -json node |
            jq -r '"client_ip=\(.public_ip)\nclient_user=\(.user)"' >> "${GITHUB_OUTPUT}"

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_PRIMARY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%b\n' "${SSH_PRIVATE_KEY}" | sed 's/\r$//' > ~/.ssh/quic-perf
          chmod 0600 ~/.ssh/quic-perf
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/quic-perf
            StrictHostKeyChecking accept-new
            ConnectionAttempts 60
          EOF

      - name: Start server
        run: |
          server="${{ steps.nodes.outputs.server_user }}@${{ steps.nodes.outputs.server_ip }}"
          if [ "${{ inputs.server_implementation }}" = "quic-go" ]; then
            ssh "${server}" 'nohup /opt/quic-go/perf/quic-go-perf --run-server --server-address=0.0.0.0:4433 >/tmp/quic-go-server.log 2>&1 & echo $! >/tmp/benchmark-server.pid'
          else
            ssh "${server}" 'nohup /opt/msquic/build/bin/Release/secnetperf -exec:maxtput -bind:0.0.0.0 >/tmp/msquic-server.log 2>&1 & echo $! >/tmp/benchmark-server.pid'
          fi
          sleep 3

      - name: Run benchmark
        id: benchmark
        run: |
          client="${{ steps.nodes.outputs.client_user }}@${{ steps.nodes.outputs.client_ip }}"
          status=0
          if [ "${{ inputs.client_implementation }}" = "quic-go" ]; then
            ssh "${client}" timeout 10m \
              /opt/quic-go/perf/quic-go-perf \
              --server-address=${{ steps.nodes.outputs.server_ip }}:4433 \
              --upload-bytes=1000000000 --download-bytes=1000000000 \
              > "${RUNNER_TEMP}/benchmark.log" 2>&1 || status=$?
          else
            ssh "${client}" timeout 10m \
              /opt/msquic/build/bin/Release/secnetperf \
              -target:${{ steps.nodes.outputs.server_ip }} -port:4433 \
              -exec:maxtput -up:1000000000 -down:1000000000 -ptput:1 \
              > "${RUNNER_TEMP}/benchmark.log" 2>&1 || status=$?
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Stop server
        if: always()
        run: |
          server="${{ steps.nodes.outputs.server_user }}@${{ steps.nodes.outputs.server_ip }}"
          ssh "${server}" 'kill "$(cat /tmp/benchmark-server.pid)" 2>/dev/null || true'

      - name: Write benchmark summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Benchmark Results

          | Node | Provider | Location | Public IP | Implementation |
          | --- | --- | --- | --- | --- |
          | Server | ${{ inputs.server_cloud_provider }} | ${{ inputs.server_location }} | ${{ steps.nodes.outputs.server_ip }} | ${{ inputs.server_implementation }} |
          | Client | ${{ inputs.client_cloud_provider }} | ${{ inputs.client_location }} | ${{ steps.nodes.outputs.client_ip }} | ${{ inputs.client_implementation }} |

          Upload: 1 GB

          Download: 1 GB

          Result: ${{ steps.benchmark.outputs.status || 'not run' }}

          ```text
          EOF
          if [ -f "${RUNNER_TEMP}/benchmark.log" ]; then
            tail -n 200 "${RUNNER_TEMP}/benchmark.log" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

  destroy-node:
    name: Destroy ${{ matrix.role }} node
    needs: [create-node, benchmark]
    if: always()
    runs-on: ubuntu-latest
    environment: cloud-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: server
            cloud_provider: ${{ inputs.server_cloud_provider }}
            location: ${{ inputs.server_location }}
            name: quic-perf-${{ inputs.server_cloud_provider }}-server-${{ github.run_id }}-${{ github.run_attempt }}
          - role: client
            cloud_provider: ${{ inputs.client_cloud_provider }}
            location: ${{ inputs.client_location }}
            name: quic-perf-${{ inputs.client_cloud_provider }}-client-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.role }}-node
          path: ${{ runner.temp }}/${{ matrix.role }}-artifact

      - name: Configure AWS credentials
        if: matrix.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Authenticate to GCP
        if: matrix.cloud_provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}

      - name: Authenticate to Azure
        if: matrix.cloud_provider == 'azure'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Destroy node
        run: |
          state="${{ runner.temp }}/${{ matrix.role }}-artifact/terraform.tfstate"
          [ -f "${state}" ] || exit 0
          terraform -chdir=infra/${{ matrix.cloud_provider }} init -input=false
          TF_VAR_name="${{ matrix.name }}" TF_VAR_location="${{ matrix.location }}" \
            terraform -chdir=infra/${{ matrix.cloud_provider }} destroy -state="${state}" -input=false -auto-approve
