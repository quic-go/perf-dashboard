name: Run benchmark

on:
  workflow_dispatch:
    inputs:
      server_cloud_provider:
        description: Server node cloud provider
        required: true
        type: choice
        options: [aws, gcp, azure]
      server_location:
        description: Server node AWS region, GCP zone, or Azure region
        required: true
      client_cloud_provider:
        description: Client node cloud provider
        required: true
        type: choice
        options: [aws, gcp, azure]
      client_location:
        description: Client node AWS region, GCP zone, or Azure region
        required: true
      server_implementation:
        description: Server implementation
        required: true
        type: choice
        options: [quic-go, msquic]
      client_implementation:
        description: Client implementation
        required: true
        type: choice
        options: [quic-go, msquic]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-benchmark
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_azure_resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY_PRIMARY }}

jobs:
  create-node:
    name: Create ${{ matrix.role }} node
    runs-on: ubuntu-latest
    environment: cloud-test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: server
            cloud_provider: ${{ inputs.server_cloud_provider }}
            location: ${{ inputs.server_location }}
            name: quic-perf-${{ inputs.server_cloud_provider }}-server-${{ github.run_id }}-${{ github.run_attempt }}
          - role: client
            cloud_provider: ${{ inputs.client_cloud_provider }}
            location: ${{ inputs.client_location }}
            name: quic-perf-${{ inputs.client_cloud_provider }}-client-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        if: matrix.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Authenticate to GCP
        if: matrix.cloud_provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}

      - name: Authenticate to Azure
        if: matrix.cloud_provider == 'azure'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Create node
        id: node
        uses: ./.github/actions/create-node
        with:
          role: ${{ matrix.role }}
          cloud_provider: ${{ matrix.cloud_provider }}
          location: ${{ matrix.location }}
          name: ${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.role }}-node
          path: ${{ runner.temp }}/${{ matrix.role }}-node/terraform.tfstate
          retention-days: 1
          if-no-files-found: ignore

  benchmark:
    name: Benchmark
    needs: create-node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-node"
          path: ${{ runner.temp }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Read node info
        id: nodes
        run: |
          set -euo pipefail
          server_state="${RUNNER_TEMP}/server-node/terraform.tfstate"
          client_state="${RUNNER_TEMP}/client-node/terraform.tfstate"
          server_node="$(terraform output -state="${server_state}" -json node)"
          client_node="$(terraform output -state="${client_state}" -json node)"
          jq -r '"server_ip=\(.public_ip)"' <<< "${server_node}" >> "${GITHUB_OUTPUT}"
          jq -r '"client_ip=\(.public_ip)"' <<< "${client_node}" >> "${GITHUB_OUTPUT}"

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_PRIMARY }}
        run: |
          printf '%b\n' "${SSH_PRIVATE_KEY}" | sed 's/\r$//' > "${RUNNER_TEMP}/quic-perf"
          chmod 0600 "${RUNNER_TEMP}/quic-perf"

      - name: Run benchmark
        run: |
          python3 orchestrator/run_benchmark.py \
            --identity-file "${RUNNER_TEMP}/quic-perf" \
            --server-host "${{ steps.nodes.outputs.server_ip }}" \
            --client-host "${{ steps.nodes.outputs.client_ip }}" \
            --server-implementation "${{ inputs.server_implementation }}" \
            --client-implementation "${{ inputs.client_implementation }}" \
            > "${RUNNER_TEMP}/benchmark-result.json"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-result
          path: ${{ runner.temp }}/benchmark-result.json
          if-no-files-found: error

      - name: Write benchmark summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Benchmark Results

          | Node | Provider | Location | Public IP | Implementation |
          | --- | --- | --- | --- | --- |
          | Server | ${{ inputs.server_cloud_provider }} | ${{ inputs.server_location }} | ${{ steps.nodes.outputs.server_ip }} | ${{ inputs.server_implementation }} |
          | Client | ${{ inputs.client_cloud_provider }} | ${{ inputs.client_location }} | ${{ steps.nodes.outputs.client_ip }} | ${{ inputs.client_implementation }} |

          EOF
          if [ -s "${RUNNER_TEMP}/benchmark-result.json" ]; then
            jq -r '
              "| Direction | Bytes | Bits per second |",
              "| --- | ---: | ---: |",
              "| Upload | \(.upload_bytes) | \(.upload_bits_per_second) |",
              "| Download | \(.download_bytes) | \(.download_bits_per_second) |"
            ' "${RUNNER_TEMP}/benchmark-result.json" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Benchmark failed or did not run." >> "${GITHUB_STEP_SUMMARY}"
          fi

  destroy-node:
    name: Destroy ${{ matrix.role }} node
    needs: [create-node, benchmark]
    if: always()
    runs-on: ubuntu-latest
    environment: cloud-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: server
            cloud_provider: ${{ inputs.server_cloud_provider }}
            location: ${{ inputs.server_location }}
            name: quic-perf-${{ inputs.server_cloud_provider }}-server-${{ github.run_id }}-${{ github.run_attempt }}
          - role: client
            cloud_provider: ${{ inputs.client_cloud_provider }}
            location: ${{ inputs.client_location }}
            name: quic-perf-${{ inputs.client_cloud_provider }}-client-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ matrix.role }}-node
          path: ${{ runner.temp }}/${{ matrix.role }}-artifact

      - name: Configure AWS credentials
        if: matrix.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Authenticate to GCP
        if: matrix.cloud_provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}

      - name: Authenticate to Azure
        if: matrix.cloud_provider == 'azure'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Destroy node
        run: |
          state="${{ runner.temp }}/${{ matrix.role }}-artifact/terraform.tfstate"
          [ -f "${state}" ] || exit 0
          terraform -chdir=infra/${{ matrix.cloud_provider }} init -input=false
          TF_VAR_name="${{ matrix.name }}" TF_VAR_location="${{ matrix.location }}" \
            terraform -chdir=infra/${{ matrix.cloud_provider }} destroy -state="${state}" -input=false -auto-approve
