name: Cleanup Old Packer Images

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  cleanup-aws:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'cloud-test' || null }}
    concurrency:
      group: cloud-aws
      cancel-in-progress: false
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
      - name: Keep only the newest AMI, delete the rest
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          image_ids="$(aws ec2 describe-images \
            --owners self \
            --filters "Name=tag:ManagedBy,Values=packer" "Name=tag:Name,Values=quic-perf-runner" \
            --query 'sort_by(Images, &CreationDate)[:-1].ImageId' \
            --output text \
            | tr '\t' '\n' \
            | sed '/^$/d')"

          if [ -z "${image_ids}" ]; then
            echo "No old AWS AMIs to delete."
            exit 0
          fi

          while read -r image_id; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Would delete AWS AMI: ${image_id}"
            else
              echo "Deleting AWS AMI: ${image_id}"
              snapshot_ids="$(aws ec2 describe-images --image-ids "${image_id}" --query 'Images[].BlockDeviceMappings[].Ebs.SnapshotId' --output text)"
              aws ec2 deregister-image --image-id "${image_id}"
              for snapshot_id in ${snapshot_ids}; do
                echo "Deleting AWS snapshot: ${snapshot_id}"
                aws ec2 delete-snapshot --snapshot-id "${snapshot_id}"
              done
            fi
          done <<< "${image_ids}"

  cleanup-gcp:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'cloud-test' || null }}
    concurrency:
      group: cloud-gcp
      cancel-in-progress: false
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PACKER_SERVICE_ACCOUNT }}
      - name: Keep only the newest image, delete the rest
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          image_names="$(gcloud compute images list \
            --filter="family=quic-perf-runner" \
            --sort-by="~creationTimestamp" \
            --format="value(name)" \
            | tail -n +2 \
            | sed '/^$/d')"

          if [ -z "${image_names}" ]; then
            echo "No old GCP images to delete."
            exit 0
          fi

          while read -r image_name; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Would delete GCP image: ${image_name}"
            else
              echo "Deleting GCP image: ${image_name}"
              gcloud compute images delete "${image_name}" --quiet
            fi
          done <<< "${image_names}"

  cleanup-azure:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'cloud-test' || null }}
    concurrency:
      group: cloud-azure
      cancel-in-progress: false
    steps:
      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete temporary Packer resources
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          resource_ids="$(az resource list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "[?tags.ManagedBy=='packer' && tags.PackerLifecycle=='temporary'].id" \
            --output tsv \
            | sed '/^$/d')"

          if [ -z "${resource_ids}" ]; then
            echo "No temporary Azure resources to delete."
            exit 0
          fi

          while read -r resource_id; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Would delete Azure resource: ${resource_id}"
            else
              echo "Deleting Azure resource: ${resource_id}"
              az resource delete --ids "${resource_id}"
            fi
          done <<< "${resource_ids}"
      - name: Keep only the newest image, delete the rest
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail

          image_ids="$(az image list \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "sort_by([?tags.ManagedBy=='packer' && starts_with(name, 'quic-perf-runner-') && not_null(tags.PackerLifecycle, 'retained')!='temporary'], &name)[:-1].id" \
            --output tsv \
            | sed '/^$/d')"

          if [ -z "${image_ids}" ]; then
            echo "No old Azure images to delete."
            exit 0
          fi

          while read -r image_id; do
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Would delete Azure image: ${image_id}"
            else
              echo "Deleting Azure image: ${image_id}"
              az image delete --ids "${image_id}"
            fi
          done <<< "${image_ids}"
